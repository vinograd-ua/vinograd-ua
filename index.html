<script>
(function(){
'use strict';

var storage = {
    get: function(k) { try { return localStorage.getItem(k); } catch(e) { return null; } },
    set: function(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }
};

window.onerror = function(msg, url, line) {
    var b = document.getElementById('err-banner');
    if (!b) {
        b = document.createElement('div');
        b.id = 'err-banner';
        b.innerHTML = '<button onclick="this.parentNode.remove()">✕</button><strong>⚠ Помилка:</strong> <span id="err-msg"></span><br><small>F12 → Console для деталей</small>';
        document.body.insertBefore(b, document.body.firstChild);
    }
    document.getElementById('err-msg').textContent = msg + ' (рядок ' + line + ')';
};

var PRODUCTS = window.PRODUCTS || [];
if (!PRODUCTS.length) {
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:Arial"><h2 style="color:red">Товари не завантажено</h2></div>';
    return;
}

var currentLanguage = storage.get('grapeLanguage') || 'uk';
var currentSearch = '';
var cart = [];
try { cart = JSON.parse(storage.get('grapeCart') || '[]'); } catch(e) { cart = []; }
var PHONE = '+380683672422';

function saveCart() { storage.set('grapeCart', JSON.stringify(cart)); }
function fmt(n) { return n.toLocaleString('uk-UA'); }
function esc(s) { return String(s || '').replace(/[&<>"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function T(uk, ru) { return currentLanguage === 'uk' ? uk : ru; }

function applyLanguageToStatic() {
    document.querySelectorAll('.lang').forEach(function(el) {
        var t = el.getAttribute('data-' + currentLanguage);
        if (t) el.textContent = t;
    });
    var inp = document.getElementById('search-input');
    if (inp) inp.placeholder = T('Пошук за назвою...', 'Поиск по названию...');
}

function filterProducts() {
    if (!currentSearch) return PRODUCTS;
    var q = currentSearch.toLowerCase().trim();
    if (!q) return PRODUCTS;
    return PRODUCTS.filter(function(p) {
        var text = [
            p.name || '',
            p.short_uk || '',
            p.short_ru || '',
            p.desc_uk || '',
            p.desc_ru || ''
        ].join(' ').toLowerCase();
        return text.indexOf(q) !== -1;
    });
}

function renderProducts() {
    var c = document.getElementById('products-container');
    if (!c) return;
    var list = filterProducts();
    var countEl = document.getElementById('search-count');
    if (!list.length) {
        c.innerHTML = '<div class="empty-results"><i class="fas fa-search"></i><p>' + T('Нічого не знайдено', 'Ничего не найдено') + '</p><p style="font-size:.85em;margin-top:8px">' + T('Спробуйте інший запит', 'Попробуйте другой запрос') + '</p></div>';
        if (countEl) countEl.textContent = '';
        return;
    }
    c.innerHTML = list.map(renderCard).join('');
    if (countEl) {
        if (currentSearch) {
            countEl.textContent = T('Знайдено: ', 'Найдено: ') + list.length + T(' із ', ' из ') + PRODUCTS.length;
        } else {
            countEl.textContent = T('Всього сортів: ', 'Всего сортов: ') + PRODUCTS.length;
        }
    }
}

function renderCard(p) {
    var imgs = (p.img || []).map(function(src, i) {
        return '<img src="' + src + '" alt="' + esc(p.name) + '" class="' + (i === 0 ? 'active' : '') + '" loading="lazy">';
    }).join('');
    var dots = (p.img || []).length > 1 ? '<div class="gallery-controls">' + p.img.map(function(_, i) {
        return '<button class="gallery-btn ' + (i === 0 ? 'active' : '') + '" onclick="APP.changePhoto(\'' + p.id + '\',' + i + ')"></button>';
    }).join('') + '</div>' : '';
    var badge = p.cat === 'new' ? ' <span style="background:#ffd54f;color:#6b4a00;font-size:.65em;padding:2px 6px;border-radius:10px">NEW</span>' : '';
    return '<div class="product">' +
        '<div class="product-gallery" data-gallery-id="' + p.id + '">' + imgs + '</div>' +
        dots +
        '<h3>' + esc(p.name) + badge + '</h3>' +
        '<div class="price">' + fmt(p.price) + ' ₴<small>' + T('за 1 черенок','за 1 черенок') + '</small></div>' +
        '<div class="product-actions">' +
            '<input type="number" min="1" value="1" class="qty-input" id="qty-' + p.id + '">' +
            '<button class="info-btn" onclick="APP.toggleDesc(\'' + p.id + '\',this)"><i class="fas fa-info-circle"></i></button>' +
            '<button class="add-btn" onclick="APP.addToCart(\'' + p.id + '\')"><i class="fas fa-cart-plus"></i> ' + T('Додати','Добавить') + '</button>' +
        '</div>' +
        '<div class="product-description" id="desc-' + p.id + '">' + renderDesc(p) + '</div>' +
        '</div>';
}

function renderDesc(p) {
    var html = '';
    if (p.specs && p.specs.length) {
        html += '<ul>';
        p.specs.forEach(function(s) {
            var label = currentLanguage === 'uk' ? s[0] : s[1];
            var value = currentLanguage === 'uk' ? s[2] : s[3];
            html += '<li><strong>' + esc(label) + '</strong> ' + esc(value) + '</li>';
        });
        html += '</ul>';
    }
    var desc = p['desc_' + currentLanguage] || p.desc_uk || '';
    if (desc) html += '<p style="margin-top:8px;padding-top:8px;border-top:1px dashed #ddd;color:#555">' + esc(desc) + '</p>';
    return html;
}

function changePhoto(id, idx) {
    var g = document.querySelector('[data-gallery-id="' + id + '"]');
    if (!g) return;
    g.querySelectorAll('img').forEach(function(im, i) { im.classList.toggle('active', i === idx); });
    var prod = g.closest('.product');
    if (prod) prod.querySelectorAll('.gallery-btn').forEach(function(b, i) { b.classList.toggle('active', i === idx); });
}

function toggleDesc(id, btn) {
    var d = document.getElementById('desc-' + id);
    if (!d) return;
    var open = d.classList.contains('open');
    document.querySelectorAll('.product-description.open').forEach(function(x) { x.classList.remove('open'); });
    if (!open) { d.classList.add('open'); btn.querySelector('i').className = 'fas fa-times'; }
    else btn.querySelector('i').className = 'fas fa-info-circle';
}

function onSearchInput(e) {
    currentSearch = e.target.value;
    var clearBtn = document.getElementById('search-clear');
    if (clearBtn) clearBtn.classList.toggle('show', currentSearch.length > 0);
    renderProducts();
}

function clearSearch() {
    currentSearch = '';
    var inp = document.getElementById('search-input');
    if (inp) { inp.value = ''; inp.focus(); }
    var clearBtn = document.getElementById('search-clear');
    if (clearBtn) clearBtn.classList.remove('show');
    renderProducts();
}

function addToCart(id) {
    var p = PRODUCTS.find(function(x) { return x.id === id; });
    if (!p) return;
    var inp = document.getElementById('qty-' + id);
    var qty = Math.max(1, parseInt(inp ? inp.value : 1) || 1);
    var ex = cart.find(function(x) { return x.id === id; });
    if (ex) ex.qty += qty;
    else cart.push({ id: id, qty: qty });
    saveCart();
    renderCart();
    notify(T('Додано: ','Добавлено: ') + p.name + ' (' + qty + ' шт.)');
    var cc = document.getElementById('cart-container');
    if (!cc.classList.contains('show')) { cc.classList.add('show'); setTimeout(function() { cc.classList.remove('show'); }, 3500); }
}

function updateQty(id, delta) {
    var it = cart.find(function(x) { return x.id === id; });
    if (!it) return;
    it.qty += delta;
    if (it.qty < 1) { cart = cart.filter(function(x) { return x.id !== id; }); }
    saveCart(); renderCart();
}

function removeFromCart(id) {
    cart = cart.filter(function(x) { return x.id !== id; });
    saveCart(); renderCart();
}

function renderCart() {
    var ci = document.getElementById('cart-items'), ct = document.getElementById('cart-total'), cc = document.getElementById('cart-count'), vb = document.getElementById('cart-viber-btn');
    if (!cart.length) {
        ci.innerHTML = '<p style="text-align:center;padding:20px;color:#666">' + T('Поки що порожньо','Пока пусто') + '</p>';
        ct.innerHTML = T('Сума:','Сумма:') + ' 0 ₴';
        cc.style.display = 'none';
        vb.disabled = true;
        return;
    }
    var total = 0, count = 0;
    ci.innerHTML = cart.map(function(it) {
        var p = PRODUCTS.find(function(x) { return x.id === it.id; });
        if (!p) return '';
        var sum = p.price * it.qty;
        total += sum; count += it.qty;
        return '<div class="cart-item"><div class="cart-item-name">' + esc(p.name) + '</div>' +
            '<div class="cart-item-sub">' + fmt(p.price) + ' ₴ × ' + it.qty + ' = <strong>' + fmt(sum) + ' ₴</strong></div>' +
            '<div class="cart-item-controls"><button class="qty-btn" onclick="APP.updateQty(\'' + it.id + '\',-1)">−</button>' +
            '<span class="qty-val">' + it.qty + '</span>' +
            '<button class="qty-btn" onclick="APP.updateQty(\'' + it.id + '\',1)">+</button>' +
            '<button class="rm" onclick="APP.removeFromCart(\'' + it.id + '\')">×</button></div></div>';
    }).join('');
    ct.innerHTML = T('Сума:','Сумма:') + ' <strong>' + fmt(total) + ' ₴</strong>';
    cc.textContent = count;
    cc.style.display = 'flex';
    vb.disabled = false;
}

function toggleCart() {
    document.getElementById('cart-container').classList.toggle('show');
}

function changeLanguage(lang) {
    if (lang === currentLanguage) return;
    currentLanguage = lang;
    storage.set('grapeLanguage', lang);
    document.querySelectorAll('.lang-btn').forEach(function(b) { b.classList.toggle('active', b.getAttribute('data-lang') === lang); });
    applyLanguageToStatic();
    renderProducts();
    renderCart();
}

function notify(msg, type) {
    document.querySelectorAll('.notification').forEach(function(n) { n.remove(); });
    var n = document.createElement('div');
    n.className = 'notification' + (type === 'error' ? ' error' : '');
    n.textContent = msg;
    document.body.appendChild(n);
    setTimeout(function() { n.remove(); }, 2800);
}

        total += sum;
        return '• ' + p.name + ' — ' + it.qty + ' шт. × ' + fmt(p.price) + ' = ' + fmt(sum) + ' грн';

        '<div style="background:#f8f9fa;padding:14px;border-radius:10px;border-left:4px solid #4a7c59;font-size:13px;margin-bottom:15px">' +

        '<div style="text-align:right;font-weight:bold">' + T('Всього:','Итого:') + ' ' + fmt(total) + ' грн</div></div>' +

        '<div style="margin-bottom:12px"><label style="font-weight:600;font-size:.9em">' + T('Телефон','Телефон') + ' *</label><input type="tel" id="f-phone" required placeholder="+380..." style="width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:15px"></div>' +
        '<div style="margin-bottom:12px"><label style="font-weight:600;font-size:.9em">' + T('Місто','Город') + ' *</label><input type="text" id="f-city" required style="width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:15px"></div>' +
        '<div style="margin-bottom:12px"><label style="font-weight:600;font-size:.9em">' + T('Відділення НП','Отделение НП') + ' *</label><input type="text" id="f-np" required style="width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:15px"></div>' +
        '<div style="margin-bottom:15px"><label style="font-weight:600;font-size:.9em">' + T('Коментар','Комментарий') + '</label><textarea id="f-comment" rows="2" style="width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:15px"></textarea></div>' +
        '<button type="submit" style="width:100%;background:#7360F2;color:#fff;padding:14px;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer"><i class="fab fa-viber"></i> ' + T('Відправити','Отправить') + '</button>' +
        '</form></div></div>';
    document.body.appendChild(m);
    setTimeout(function() { document.getElementById('f-name').focus(); }, 100);
}

function processOrder(e) {
    e.preventDefault();
    var d = {
        name: document.getElementById('f-name').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        city: document.getElementById('f-city').value.trim(),
        np: document.getElementById('f-np').value.trim(),
        comment: document.getElementById('f-comment').value.trim()
    };
    var total = 0, lines = '';
    cart.forEach(function(it) {
        var p = PRODUCTS.find(function(x) { return x.id === it.id; });
        if (!p) return;
        var sum = p.price * it.qty;
        total += sum;
        lines += '✅ ' + p.name + '\n   ' + T('Кількість','Количество') + ': ' + it.qty + ' шт.\n   ' + fmt(p.price) + ' грн × ' + it.qty + ' = ' + fmt(sum) + ' грн\n\n';
    });
    var text = T('🍇 ЗАМОВЛЕННЯ ЧЕРЕНКІВ 🍇','🍇 ЗАКАЗ ЧЕРЕНКОВ 🍇') + '\n\n' + lines +
        '💰 ' + T('Загальна сума','Общая сумма') + ': ' + fmt(total) + ' грн\n\n' +
        '👤 ' + d.name + '\n📞 ' + d.phone + '\n📍 ' + d.city + '\n📦 ' + d.np + '\n';
    if (d.comment) text += '💬 ' + d.comment + '\n';
    document.getElementById('order-modal').remove();
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(showSuccess).catch(function() { fallbackCopy(text); });
    } else { fallbackCopy(text); }
}

function fallbackCopy(t) {
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showSuccess(); } catch(e) { alert(t); }
    document.body.removeChild(ta);
}

function showSuccess() {
    var m = document.createElement('div');
    m.className = 'viber-modal';

var admEditing = null;
var admDirty = false;

function openAdmin() {
    if (document.getElementById('admin-overlay')) return;
    admWorking = JSON.parse(JSON.stringify(PRODUCTS));
    admEditing = null;
    admDirty = false;
    var el = document.createElement('div');
    el.id = 'admin-overlay';
    el.innerHTML = '<div class="adm-panel">' +

            '<td><input type="text" value="' + escA(s[1]||'') + '" oninput="ADMIN.setSpec('+i+',1,this.value)" style="width:100%;padding:5px;border:1px solid #ddd;border-radius:4px"></td>' +
            '<td><input type="text" value="' + escA(s[2]||'') + '" oninput="ADMIN.setSpec('+i+',2,this.value)" style="width:100%;padding:5px;border:1px solid #ddd;border-radius:4px"></td>' +
            '<td><input type="text" value="' + escA(s[3]||'') + '" oninput="ADMIN.setSpec('+i+',3,this.value)" style="width:100%;padding:5px;border:1px solid #ddd;border-radius:4px"></td>' +
            '<td><button onclick="ADMIN.rmSpec('+i+')" style="background:#e74c3c;color:#fff;border:none;width:22px;height:22px;border-radius:4px;cursor:pointer;font-weight:bold">×</button></td></tr>';

    list.innerHTML = '<div class="adm-edit-form">' +

        '<div class="adm-grid2">' +

        '<div class="adm-grid2">' +

function escA(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

var ADMIN = {
    close: function() {
        if (admDirty && !confirm('Незбережені зміни. Закрити?')) return;
        var el = document.getElementById('admin-overlay');
        if (el) el.remove();
        document.body.style.overflow = '';
    },
    edit: function(i) { admEditing = i; renderAdmEdit(); },
    cancel: function() { admEditing = null; renderAdmList(); },
    setField: function(k, v) {
        if (admEditing === null) return;
        admWorking[admEditing][k] = v;
        admDirty = true;
    },
    setSpec: function(i, f, v) {
        if (admEditing === null) return;
        var p = admWorking[admEditing];
        if (!p.specs) p.specs = [];
        if (!p.specs[i]) p.specs[i] = ['','','',''];
        p.specs[i][f] = v;
        admDirty = true;
    },
    addSpec: function() {
        if (admEditing === null) return;
        var p = admWorking[admEditing];
        if (!p.specs) p.specs = [];
        p.specs.push(['','','','']);
        admDirty = true;
        renderAdmEdit();
    },
    rmSpec: function(i) {
        if (admEditing === null) return;
        admWorking[admEditing].specs.splice(i, 1);
        admDirty = true;
        renderAdmEdit();
    },
    save: function() {
        if (admEditing === null) return;
        var p = admWorking[admEditing];
        if (!p.name || !p.id) { alert('Заповніть назву та ID'); return; }
        admEditing = null;
        admDirty = true;
        renderAdmList();
        notify('Збережено');
    },
    addNew: function() {
        var name = prompt('Назва нового товару:');
        if (!name || !name.trim()) return;
        admWorking.unshift({ id: 'p_' + Date.now(), name: name.trim(), price: 100, cat: '', img: [], short_uk: '', short_ru: '', desc_uk: '', desc_ru: '', specs: [] });
        admEditing = 0;
        admDirty = true;
        renderAdmEdit();
    },
    del: function(i) {
        if (!confirm('Видалити "' + admWorking[i].name + '"?')) return;
        admWorking.splice(i, 1);
        admEditing = null;
        admDirty = true;
        renderAdmList();
    },
    importJSON: function() {
        var modal = document.createElement('div');
        modal.className = 'adm-json-modal';
        modal.innerHTML = '<div class="adm-json-box"><h3>📥 Імпорт товарів з JSON</h3>' +
            '<p style="font-size:13px;color:#555;margin-bottom:10px">Вставте JSON-масив товарів</p>' +
            '<textarea id="import-json" placeholder=\'[{"id":"test1","name":"Сорт","price":100,"cat":"","img":["url"],"short_uk":"","short_ru":"","desc_uk":"","desc_ru":"","specs":[]}]\'></textarea>' +
            '<div style="margin-top:10px">' +
            '<button style="background:#27ae60;color:#fff" onclick="ADMIN.doImport()">✓ Імпортувати</button>' +
            '<button style="background:#f0f0f0;color:#555" onclick="this.closest(\'.adm-json-modal\').remove()">Скасувати</button>' +
            '</div></div>';
        document.body.appendChild(modal);
    },
    doImport: function() {
        var text = document.getElementById('import-json').value;
        try {
            var arr = JSON.parse(text);
            if (!Array.isArray(arr)) throw new Error('Це не масив');
            var added = 0;
            arr.forEach(function(item) {
                if (!item.id || !item.name) return;
                if (admWorking.some(function(x) { return x.id === item.id; })) {
                    item.id = item.id + '_' + Date.now();
                }
                admWorking.push({
                    id: item.id, name: item.name, price: item.price || 100,
                    cat: item.cat || '', img: item.img || [],
                    short_uk: item.short_uk || '', short_ru: item.short_ru || '',
                    desc_uk: item.desc_uk || '', desc_ru: item.desc_ru || '',
                    specs: item.specs || []
                });
                added++;
            });
            document.querySelector('.adm-json-modal').remove();
            admDirty = true;
            renderAdmList();
            alert('Імпортовано: ' + added + ' товарів');
        } catch(e) {
            alert('Помилка JSON: ' + e.message);
        }
    },
    exportJSON: function() {
        var json = JSON.stringify(admWorking, null, 2);
        var blob = new Blob([json], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'products-backup.json'; a.click();
        URL.revokeObjectURL(url);
    },
    exportHTML: function() {
        PRODUCTS.length = 0;
        admWorking.forEach(function(x) { PRODUCTS.push(x); });
        renderProducts(); renderCart();
        admDirty = false;
        var productsScript = 'window.PRODUCTS = ' + JSON.stringify(admWorking) + ';';
        fetch(location.href).then(function(r) { return r.text(); }).then(function(html) {
            var m = html.match(/(<script>\s*window\.PRODUCTS\s*=\s*)[\s\S]*?(\s*<\/script>)/);
            if (!m) throw new Error('Не знайдено блок PRODUCTS');
            var newHtml = html.replace(m[0], m[1] + productsScript + '\n<\/script>');
            var blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url; a.download = 'index.html'; a.click();
            URL.revokeObjectURL(url);
            alert('✅ index.html скачано. Замініть файл у проєкті → Commit → Push.');
        }).catch(function(err) {
            var modal = document.createElement('div');
            modal.className = 'adm-json-modal';
            modal.innerHTML = '<div class="adm-json-box"><h3>📋 Скопіюйте блок вручну</h3>' +
                '<p style="font-size:13px;color:#555">Автоскачування не спрацювало (' + escA(err.message) + '). Скопіюйте код нижче і вставте замість <code>window.PRODUCTS = [{"id":"shugra48","name":"Кишмиш Шугра 48","price":1200,"cat":"new","img":["https://i.postimg.cc/Jn71gSc0/mid...];</code> в файлі.</p>' +
                '<textarea readonly>' + escA(productsScript) + '</textarea>' +
                '<button style="background:#4a7c59;color:#fff" onclick="var t=this.parentNode.querySelector(\'textarea\');t.select();document.execCommand(\'copy\');alert(\'Скопійовано!\')">📋 Скопіювати</button>' +
                '<button style="background:#f0f0f0;color:#555" onclick="this.closest(\'.adm-json-modal\').remove()">Закрити</button>' +
                '</div>';
            document.body.appendChild(modal);
        });
    }
};

window.ADMIN = ADMIN;

if (new URLSearchParams(location.search).get('admin') === '1') setTimeout(openAdmin, 400);
var clicks = 0, tt;
document.addEventListener('click', function(e) {
    if (e.target.closest && e.target.closest('h1.site-title')) {
        clicks++;
        clearTimeout(tt);
        tt = setTimeout(function() { clicks = 0; }, 800);
        if (clicks >= 3) { clicks = 0; openAdmin(); }
    }
});

function init() {
    document.querySelectorAll('.lang-btn').forEach(function(b) {
        b.classList.toggle('active', b.getAttribute('data-lang') === currentLanguage);
        b.addEventListener('click', function() { changeLanguage(b.getAttribute('data-lang')); });
    });
    applyLanguageToStatic();
    var si = document.getElementById('search-input');
    if (si) si.addEventListener('input', onSearchInput);
    renderProducts();
    renderCart();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
